name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - if: runner.os == 'Linux'
        run: go test -race -count=1 -short ./...
      - if: runner.os == 'Linux'
        name: 32-bit
        run: GOARCH=386 go test -count=1 -short .

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: go vet ./...
      - run: go test -count=1 -short ./...

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build the WebAssembly store and run it in Node
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          go vet ./...
          go build -trimpath -ldflags '-s -w' -o xkv.wasm ./wasm
          ls -l xkv.wasm
          GOOS= GOARCH= node wasm/smoke.cjs "$(go env GOROOT)/lib/wasm/wasm_exec.js" ./xkv.wasm
