name: release

# Builds the xkv binaries, checks each one, and publishes them with a
# release.
#
# Releases go out on their own. When the tests pass on a push to main and the
# version in xkv.go has no tag yet, this workflow builds and checks the
# binaries from that commit, then tags it and publishes the release with the
# binaries attached. Nothing goes public unless every build and check passes.
#
# It also attaches binaries to a release someone publishes by hand, and it
# can be run by hand to rebuild the binaries of an existing tag.

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, such as v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  plan:
    # After the tests, only for a push to main in this repository that passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      new: ${{ steps.plan.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
          workflow_run)
            # Only the commit main is at now; if main has moved on, the run
            # after the next push decides.
            head=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$head" != "$RUN_SHA" ]; then
              echo "No release: main has moved on from $RUN_SHA to $head."
              exit 0
            fi
            version=$(sed -n 's/^const Version = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' xkv.go)
            if [ -z "$version" ]; then
              echo "xkv.go has no Version of the form X.Y.Z" >&2
              exit 1
            fi
            tags=$(git ls-remote --tags --refs origin) || { echo "Couldn't read the repository's tags" >&2; exit 1; }
            if grep -q "refs/tags/v$version\$" <<< "$tags"; then
              echo "No release: v$version is out already."
              exit 0
            fi
            newest=$({ grep -o 'refs/tags/v[0-9]*\.[0-9]*\.[0-9]*$' <<< "$tags" || true; } | sed 's|refs/tags/v||' | sort -V | tail -n 1)
            if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
              echo "v$version is older than the newest release, v$newest; raise the version above it" >&2
              exit 1
            fi
            echo "Releasing v$version from $RUN_SHA."
            { echo "tag=v$version"; echo "ref=$RUN_SHA"; echo "new=true"; } >> "$GITHUB_OUTPUT"
            ;;
          release)
            { echo "tag=$RELEASE_TAG"; echo "ref=$RELEASE_TAG"; } >> "$GITHUB_OUTPUT"
            ;;
          workflow_dispatch)
            { echo "tag=$INPUT_TAG"; echo "ref=$INPUT_TAG"; } >> "$GITHUB_OUTPUT"
            ;;
          esac

  linux:
    needs: plan
    if: needs.plan.outputs.tag != ''
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Build a static binary
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags '-s -w' -o xkv ./cmd/xkv
      - run: file xkv && sh scripts/smoke.sh ./xkv
      - name: Package
        run: |
          mkdir pkg && cp xkv LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md pkg/
          tar -czf xkv_linux_${{ matrix.arch }}.tar.gz -C pkg .
      - uses: actions/upload-artifact@v7
        with:
          name: xkv_linux_${{ matrix.arch }}
          path: xkv_linux_${{ matrix.arch }}.tar.gz

  macos:
    needs: plan
    if: needs.plan.outputs.tag != ''
    strategy:
      matrix:
        arch: [arm64, amd64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags '-s -w' -o xkv ./cmd/xkv
      - run: file xkv
      - if: matrix.arch == 'arm64'
        run: sh scripts/smoke.sh ./xkv
      - name: Package
        run: |
          mkdir pkg && cp xkv LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md pkg/
          tar -czf xkv_darwin_${{ matrix.arch }}.tar.gz -C pkg .
      - uses: actions/upload-artifact@v7
        with:
          name: xkv_darwin_${{ matrix.arch }}
          path: xkv_darwin_${{ matrix.arch }}.tar.gz

  windows:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zip
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags '-s -w' -o xkv.exe ./cmd/xkv
      - name: Package
        run: |
          file xkv.exe
          mkdir pkg && cp xkv.exe LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md pkg/
          (cd pkg && zip -q ../xkv_windows_amd64.zip *)
      - uses: actions/upload-artifact@v7
        with:
          name: xkv_windows_amd64
          path: xkv_windows_amd64.zip

  windows-check:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xkv_windows_amd64
      - name: Run the Windows binary
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Expand-Archive xkv_windows_amd64.zip -DestinationPath bin
          $xkv = Resolve-Path bin\xkv.exe
          & $xkv version
          & $xkv put check.xkv chargeback:cb_991 "card dispute filed" --reason "bank notice" --actor billing-worker
          & $xkv put check.xkv risk:42:score 0.82 --reason "new chargeback" --cause chargeback:cb_991 --actor risk-model
          & $xkv put check.xkv risk:42:score 0.90 --reason "second look" --cause chargeback:cb_991 --actor risk-model
          & $xkv compact check.xkv
          $why = & $xkv why --json check.xkv risk:42:score | ConvertFrom-Json
          if ($why.causes[0].revision.key -ne 'chargeback:cb_991') { & $xkv why check.xkv risk:42:score; throw "the chain is broken" }
          & $xkv check check.xkv
          Write-Output "windows check passed"

  release:
    needs: [plan, linux, macos, windows, windows-check]
    # Two runs for the same tag take turns; the second finds it published.
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
      NEW: ${{ needs.plan.outputs.new }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<'EOF'
          Ready-built xkv binaries. Each archive holds the `xkv` command with its license files.

          | System | File |
          |---|---|
          | Linux, x86-64 (static) | xkv_linux_amd64.tar.gz |
          | Linux, ARM64 (static) | xkv_linux_arm64.tar.gz |
          | macOS, Apple silicon | xkv_darwin_arm64.tar.gz |
          | macOS, Intel | xkv_darwin_amd64.tar.gz |
          | Windows, x86-64 | xkv_windows_amd64.zip |

          SHA256SUMS lists the checksums. The macOS binaries aren't signed by Apple, so macOS may ask you to allow them the first time, or you can run `xattr -d com.apple.quarantine xkv`.
          EOF
      - name: Tag the commit and publish the release, binaries attached
        if: env.NEW == 'true'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is out already."
            exit 0
          fi
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --title "xkv $TAG" --notes-file ../notes.md \
            xkv_linux_amd64.tar.gz xkv_linux_arm64.tar.gz xkv_darwin_arm64.tar.gz xkv_darwin_amd64.tar.gz xkv_windows_amd64.zip SHA256SUMS
      - name: Attach the binaries to an existing release
        if: env.NEW != 'true'
        run: |
          cd dist
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            xkv_linux_amd64.tar.gz xkv_linux_arm64.tar.gz xkv_darwin_arm64.tar.gz xkv_darwin_amd64.tar.gz xkv_windows_amd64.zip SHA256SUMS
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$body" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file ../notes.md
          fi
